<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://w3.org">

<html xmlns="http://w3.org">
 <head>
  <title>Onus Chartered Accountant</title>
  <meta name="description" content="Auckland Chartered Accountant, Accounting and Taxation Services">
  <meta name="keywords" content="Accounting Auckland, Affordable,Tax, Taxation, Cheap, Rental, Tax Returns">
  <meta http-equiv="content-type" content="text/html;charset=utf-8" />
  <!-- Added viewport meta tag to ensure proper scaling on mobile devices -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style type="text/css" media="screen">
    body {
        font-family: Arial, sans-serif;
        background-color: #f9f9f9;
        margin: 0;
        padding: 0;
    }
    #wrapper {
        width: 950px;
        max-width: 100%;
        margin: 25px auto;
        padding: 0 15px;
        box-sizing: border-box;
    }
    
    /* Navigation Bar Styling - Right Aligned */
    .navbar {
        position: relative;
        text-align: right;
        margin-bottom: 20px;
        padding: 10px 0;
        border-bottom: none;
    }
    .nav-links {
        display: inline-block;
    }
    .nav-btn {
        display: inline-block;
        padding: 8px 12px;
        margin-left: 15px;
        background-color: transparent;
        color: #333;
        text-decoration: none;
        font-weight: bold;
        border: none;
        border-radius: 0;
    }
    .nav-btn:hover {
        color: #0056b3;
        text-decoration: underline;
        background-color: transparent;
    }
    .nav-btn.active {
        color: #0056b3;
        background-color: transparent;
        border: none;
        text-decoration: underline;
    }

    /* Hamburger Menu Button (Hidden by default on desktops) */
    .menu-toggle {
        display: none;
        background: none;
        border: 1px solid #ccc;
        background-color: #e3e3e3;
        font-size: 24px;
        padding: 6px 12px;
        border-radius: 4px;
        cursor: pointer;
        color: #333;
        position: absolute;
        right: 0;
        top: 50%;
        transform: translateY(-50%);
    }
    .menu-toggle:hover {
        background-color: #d0d0d0;
    }

    /* Responsive Images */
    img {
        max-width: 100%;
        height: auto;
    }

    /* Mobile Media Query for screens 600px wide or smaller */
    @media screen and (max-width: 600px) {
        #wrapper {
            margin: 10px auto;
            padding: 0 10px;
        }
        .navbar {
            padding: 15px 0;
            text-align: left; 
        }
        .menu-toggle {
            display: block; /* Show hamburger icon on mobile */
        }
        /* Hide links by default on mobile until toggled */
        .nav-links {
            display: none; 
            position: absolute;
            top: calc(100% + 12px); /* Lowered further so it clears the icon entirely */
            right: 0;
            width: 200px; /* Restricts the background width to fit just the buttons */
            background: #fff;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.08);
            box-sizing: border-box;
            text-align: right; 
            z-index: 100;
        }
        /* Class added via JavaScript when menu is open */
        .nav-links.show {
            display: block; 
        }
        .nav-btn {
            display: block;
            width: 100%;
            margin: 0;
            padding: 8px 0;
            font-size: 16px;
            background-color: transparent;
            border: none;
            border-radius: 0;
            text-align: right; 
        }
        .nav-btn:hover {
            background-color: transparent;
            color: #0056b3;
            text-decoration: underline;
        }
        .nav-btn.active {
            background-color: transparent;
            color: #0056b3;
            border: none;
            text-decoration: underline;
        }
    }
  </style>
 </head>

 <body>
  <div id="wrapper">
    <!-- Navigation Tabs -->
    <div class="navbar">
        <!-- Hamburger Menu Icon Button -->
        <button type="button" class="menu-toggle" onclick="toggleMenu()" aria-label="Toggle navigation menu">&#9776;</button>
        
        <!-- Navigation Links Container -->
        <div id="navLinks" class="nav-links">
            <a href="index.html" class="nav-btn active">Home</a>
            <a href="tax-calculator.html" class="nav-btn">Tax Calculator</a>
        </div>
    </div>

    <center>
      <!-- Start Content Area -->
      <table border="0" cellpadding="0" cellspacing="0" width="100%">
        <tr>
          <td align="center" valign="top">
            <p>
              <img border="0" src="panel1.png" alt="" onerror="this.style.display='none';" />
              <img border="0" src="panel2.png" alt="" onerror="this.style.display='none';" />
              <img border="0" src="panel3.png" alt="" onerror="this.style.display='none';" />
              <img border="0" src="panel4.png" alt="" onerror="this.style.display='none';" />
              <img border="0" src="panel5.png" alt="" onerror="this.style.display='none';" />
              <img border="0" src="panel6.png" alt="" onerror="this.style.display='none';" />
              <img border="0" src="panel7.png" alt="" onerror="this.style.display='none';" />
              <img border="0" src="panel8.png" alt="" onerror="this.style.display='none';" />
              <img border="0" src="panel9.png" alt="" onerror="this.style.display='none';" />
              <img border="0" src="panel10.png" alt="" onerror="this.style.display='none';" />
            </p>
          </td>
        </tr>
      </table>
      <!-- End Content Area -->
    </center>
  </div>

  <!-- JavaScript to toggle mobile menu open/close -->
  <script type="text/javascript">
    function toggleMenu() {
        var links = document.getElementById('navLinks');
        links.classList.toggle('show');
    }
  </script>
 </body>
</html>
